<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bureau — Quêtes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/grimoire/tokens.css">
<link rel="stylesheet" href="ds/grimoire/components/bundle.css">
<script src="ds/grimoire/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin: 0; }
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 1440px; height: 1300px; box-sizing: border-box; display: flex; align-items: stretch; background: var(--surface); font-family: var(--font-serif); color: var(--ink);">
  <x-import component-from-global-scope="Grimoire.BookmarkNav" variant="full" kicker="Campagne" title="L'Âge des Cendres" items="{{navItems}}" value="quests" onChange="{{noop}}" footer="Session XIV · 12 septembre"></x-import>
  <div style="flex: 1; min-width: 0; display: flex;">
    <div style="flex: 1; min-width: 0; padding: 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 0; font: 600 30px/36px var(--font-display); color: var(--ink);">Quêtes</h1>
        <x-import component-from-global-scope="Grimoire.Button" variant="primary" icon="{{addIcon}}" onClick="{{noop}}">Nouvelle quête</x-import>
      </div>
      <x-import component-from-global-scope="Grimoire.Tabs" items="{{statusTabs}}" value="active" onChange="{{noop}}" aria-label="Filtrer les quêtes"></x-import>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-content: start;">
        <sc-for list="{{quests}}" as="q" hint-placeholder-count="6">
          <x-import component-from-global-scope="Grimoire.QuestCard" title="{{q.title}}" status="{{q.status}}" giver="{{q.giver}}" location="{{q.location}}" level="{{q.level}}" summary="{{q.summary}}" objectives="{{q.objectives}}" rewards="{{q.rewards}}" selected="{{q.selected}}" visibility="{{q.visibility}}" onClick="{{noop}}"></x-import>
        </sc-for>
      </div>
    </div>
    <div style="width: 420px; flex: none; background: var(--surface-raised); border-left: 1px solid var(--hairline); padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;">
        <h2 style="margin: 0; font: 600 30px/36px var(--font-display); color: var(--ink);">{{panel.title}}</h2>
        <x-import component-from-global-scope="Grimoire.Button" variant="ghost" size="sm" onClick="{{noop}}">Fermer</x-import>
      </div>
      <div class="gr-quest__meta">Donnée par {{panel.giver}} · {{panel.location}} · Niv. {{panel.level}}</div>
      <p style="margin: 0; font: 400 17px/26px var(--font-serif); color: var(--ink);">{{panel.summary}}</p>
      <div>
        <div style="font: 700 12px/16px var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px;">Objectifs</div>
        <ul class="gr-objs">
          <sc-for list="{{panel.objectives}}" as="o" hint-placeholder-count="4">
            <x-import component-from-global-scope="Grimoire.Objective" done="{{o.done}}" optional="{{o.optional}}" visibility="{{o.visibility}}" onToggle="{{noop}}">{{o.label}}</x-import>
          </sc-for>
        </ul>
      </div>
      <x-import component-from-global-scope="Grimoire.RewardList" rewards="{{panel.rewards}}"></x-import>
      <x-import component-from-global-scope="Grimoire.SecretBlock" level="gm">
        <p style="margin: 0;">{{panel.secretNote}}</p>
      </x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["parchemin","donjon"],"default":"parchemin"},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    var G = window.Grimoire || {};
    var h = React.createElement;
    var noop = function () {};
    function icon(name, size) { return h(G.Icon, { name: name, size: size || 20 }); }
    function chip(name, kind, rep) { return h(G.ContactChip, { name: name, kind: kind, reputation: rep }); }

    var statusTabs = [
      { id: "active", label: "En cours", count: 3 },
      { id: "completed", label: "Accomplies", count: 1 },
      { id: "failed", label: "Échouées", count: 1 },
      { id: "rumor", label: "Rumeurs", count: 1 }
    ];

    var navItems = [
      { id: "quests", label: "Quêtes", icon: icon("quete"), count: 3 },
      { id: "journal", label: "Journal", icon: icon("journal") },
      { id: "contacts", label: "Contacts", icon: icon("joueurs") },
      { id: "places", label: "Lieux", icon: icon("carte") },
      { id: "loot", label: "Butin", icon: icon("butin") },
      { divider: true, id: "d1" },
      { id: "settings", label: "Réglages", icon: icon("reglages") }
    ];

    var quests = [
      {
        id: "q1", title: "La crypte sous Otari", status: "active", selected: true,
        giver: chip("Wrin Sivinxi", "npc", 3), location: "Otari", level: 2,
        summary: "Des lueurs ont été vues sous la vieille chapelle. Wrin paiera bien qui découvrira leur source.",
        objectives: [
          { label: "Interroger le forgeron d'Otari", done: true },
          { label: "Trouver l'entrée de la crypte", done: true },
          { label: "Retrouver le médaillon de la prêtresse" },
          { label: "Épargner le gardien squelette", optional: true, visibility: { level: "players", players: [{ name: "Kyra" }] } }
        ],
        rewards: [
          { kind: "coin", label: "250 po" },
          { kind: "xp", label: "80 XP" },
          { kind: "item", label: "Lame de lune", rarity: "rare", note: "épée longue +1", to: "Valeros" },
          { kind: "item", label: "Potion de guérison moyenne", rarity: "uncommon" }
        ]
      },
      {
        id: "q2", title: "Le serment des Cendres", status: "active", selected: false,
        visibility: { level: "gm" },
        giver: chip("Les Chevaliers de Lastwall", "faction", 1), location: "Ravin d'Ardis", level: 4,
        summary: "Un éclaireur de Lastwall a disparu près du ravin ; la faction ignore encore qu'il a rejoint les cultistes.",
        objectives: [
          { label: "Suivre la piste de l'éclaireur", done: true },
          { label: "Confirmer sa trahison" },
          { label: "Décider du sort de Corvin" }
        ],
        rewards: [
          { kind: "coin", label: "500 po" },
          { kind: "reputation", label: "Chevaliers de Lastwall +2" }
        ]
      },
      {
        id: "q3", title: "L'escorte du marchand", status: "completed", selected: false,
        giver: chip("Oleg Leveton", "npc", 4), location: "Route de Breachill", level: 1,
        summary: "Trois jours sur la route, une charrette de fourrures et une bande de gobelins trop curieux.",
        objectives: [
          { label: "Escorter la charrette jusqu'à Breachill", done: true },
          { label: "Repousser l'embuscade", done: true },
          { label: "Livrer les fourrures", done: true }
        ],
        rewards: [{ kind: "coin", label: "80 po", claimed: true }]
      },
      {
        id: "q4", title: "Le pacte des ombres", status: "failed", selected: false,
        location: "Marché noir d'Almas", level: 3,
        summary: "Un informateur promettait le nom du commanditaire ; il a filé avant la pleine lune.",
        objectives: [
          { label: "Retrouver l'informateur", done: true },
          { label: "Obtenir le nom avant la pleine lune" }
        ],
        rewards: []
      },
      {
        id: "q5", title: "Le phare noyé", status: "rumor", selected: false,
        location: "Côte des Brumes",
        summary: "Un marin ivre jure avoir vu la lanterne s'allumer sous les flots.",
        objectives: [],
        rewards: []
      },
      {
        id: "q6", title: "La dette des Emberlyn", status: "active", selected: false,
        visibility: { level: "players", players: [{ name: "Kyra" }] },
        giver: chip("Yvane Emberlyn", "npc", 4), location: "Otari", level: 2,
        summary: "La grand-mère de Kyra demande qu'on retrouve la broche de famille, gagée pour payer une dette de jeu.",
        objectives: [
          { label: "Retrouver le prêteur sur gages", done: true },
          { label: "Racheter ou reprendre la broche" }
        ],
        rewards: [
          { kind: "reputation", label: "Famille Emberlyn +1" },
          { kind: "other", label: "Un repas chez les Emberlyn" }
        ]
      }
    ];

    var panel = {
      title: "La crypte sous Otari",
      giver: chip("Wrin Sivinxi", "npc", 3),
      location: "Otari",
      level: 2,
      summary: "Des lueurs ont été vues sous la vieille chapelle. Wrin paiera bien qui découvrira leur source.",
      objectives: quests[0].objectives,
      rewards: quests[0].rewards,
      secretNote: "Le médaillon est un faux : le vrai est resté dans le coffre de la prêtresse. Wrin le sait et se tait."
    };

    return {
      theme: this.props.theme || "parchemin",
      noop: noop,
      statusTabs: statusTabs,
      navItems: navItems,
      quests: quests,
      panel: panel,
      addIcon: icon("ajouter", 20)
    };
  }
}
</script>
</body>
</html>
