<!doctype html>
<html>
<head><meta charset="utf-8"><title>Tabs</title></head>
<body>
<div id="root"></div>
<script>
  var G = window.Grimoire, h = React.createElement;
  function Demo() {
    var s = React.useState('active'), v = s[0], set = s[1];
    return h(G.Tabs, {
      items: [
        { id: 'active', label: 'En cours', count: 3 },
        { id: 'completed', label: 'Accomplies', count: 1 },
        { id: 'failed', label: 'Échouées', count: 1 },
        { id: 'rumor', label: 'Rumeurs', count: 1 }
      ],
      value: v, onChange: set
    });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
