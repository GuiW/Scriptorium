<!-- @dsCard group="Navigation" height=500 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>BookmarkNav</title>
<style>html,body{margin:0;height:100%}#root{display:flex;height:500px;gap:24px;background:var(--surface)}.frame{display:flex;border-right:1px solid var(--hairline)}.frame .page{width:200px;padding:32px 24px}.page .k{font:700 11px/14px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}.page h1{margin:4px 0 0;font:600 26px/32px var(--font-display);color:var(--ink)}.page p{font:400 15px/22px var(--font-serif);color:var(--ink-muted)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var G = window.Grimoire, h = React.createElement;
  var items = [
    {id:'quests', label:'Qu\u00EAtes', icon:h(G.Icon,{name:'quete'}), count:4},
    {id:'journal', label:'Journal', icon:h(G.Icon,{name:'journal'}), count:14},
    {id:'contacts', label:'Contacts', icon:h(G.Icon,{name:'joueurs'})},
    {id:'places', label:'Lieux', icon:h(G.Icon,{name:'carte'})},
    {id:'loot', label:'Butin', icon:h(G.Icon,{name:'butin'})},
    {divider:true, id:'d1'},
    {id:'settings', label:'R\u00E9glages', icon:h(G.Icon,{name:'reglages'})}
  ];
  function Frame(props) {
    var s = React.useState('quests'), v = s[0], set = s[1];
    var cur = items.filter(function(i){return i.id===v})[0];
    return h('div', {className:'frame'},
      h(G.BookmarkNav, {variant:props.variant, kicker:'Campagne', title:'L\u2019\u00C2ge des Cendres', items:items, value:v, onChange:set, footer:'Session XIV \u00B7 12 septembre'}),
      h('main', {className:'page'}, h('div', {className:'k'}, props.variant === 'rail' ? 'Tablette \u00B7 rail' : 'Bureau'), h('h1', null, cur.label), h('p', null, 'Contenu de la page.')));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h(Frame, {variant:'full'}), h(Frame, {variant:'rail'})));
</script>
</body>
</html>
